services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sp_user
      POSTGRES_PASSWORD: sp_password
      POSTGRES_DB: points_sourires
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sp_user -d points_sourires"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://sp_user:sp_password@postgres:5432/points_sourires
      # tsx watch embarque chokidar, dont les events fs natifs ne remontent pas
      # de manière fiable depuis un bind mount Windows -> conteneur Linux (Docker
      # Desktop) : sans ça, un fichier modifié côté host ne redémarre jamais le
      # serveur, qui continue silencieusement à tourner sur l'ancien code.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app/server
      - server-node-modules:/app/server/node_modules
    command: sh -c "cd /app && pnpm install --frozen-lockfile --filter sp-server && cd /app/server && pnpm migrate && pnpm dev"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    env_file:
      - ./client/.env
    environment:
      # Même raison que côté server (voir plus haut) : Vite watche aussi via
      # chokidar, qui respecte ces variables nativement.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./client:/app/client
      - client-node-modules:/app/client/node_modules
    command: sh -c "cd /app && pnpm install --frozen-lockfile --filter sp-client && cd /app/client && pnpm dev"

  # Jeu NanoForge du défi "tic_tac_toe" (voir CLAUDE.md section 4) — contrairement à
  # server/client, pas de bind-mount ni de mode watch : @nanoforge-dev/cli (`nf`)
  # est cassé sur Windows natif (voir games/tic-tac-toe/Dockerfile) et son mode
  # `dev` ouvre un port de watcher aléatoire non publiable proprement. Le build est
  # donc figé dans l'image ; un changement de code exige
  # `docker compose up -d --build tic-tac-toe`.
  tic-tac-toe:
    build:
      context: .
      dockerfile: games/tic-tac-toe/Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
      - ./games/tic-tac-toe/.env
    ports:
      - "5175:5175"
      - "4446:4446"

volumes:
  postgres-data:
  server-node-modules:
  client-node-modules:
